name: 🚀 Deploy website API
on:
  push:
    branches:
      - master
jobs:
  web-deploy:
    name: 🎉 Deploy new version to Datatrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️ 🚚 Get latest code
        uses: actions/checkout@v2
        with:
          persist-credential: false
      - name: Sync files 📂 Server hostinger -> datatrix
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER_NAME }}
          username: ${{ secrets.FTP_USER_NAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          dangerous-clean-slate: false
          log-level: verbose
          protocol: ftps
          security: loose
          timeout: 180001
          local-dir: ./
          exclude: |
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/docs/**
            **/.env*
            **/.git*
            **/.git*/**
            **/.github/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            phpunit.xml
            phpunit.xml.dist
            favicon.ico
